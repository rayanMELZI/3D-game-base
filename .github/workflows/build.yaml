name: Build and Release Unity Game

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like 'v1.0.0'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write # Required to allow GitHub Actions to create a Release

jobs:
  build-and-release:
    name: Build for Windows and Release
    runs-on: ubuntu-latest # Free tier runner
    
    steps:
      # 1. NEW STEP: Delete pre-installed software to make room for Unity
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      # 2. Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # Essential if you use Git Large File Storage for 3D models/audio

      # 3. Cache the Unity Library folder to speed up future builds
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 4. Install Velopack CLI
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # 5. Pack the build with Velopack
      - name: Create Velopack Installer
        run: |
          # Strip the 'v' from the tag (e.g., v1.0.1 becomes 1.0.1)
          VERSION=${GITHUB_REF_NAME#v}
          
          # Pack the game. Change NouveauDossier.exe to your actual executable name!
          vpk pack -u MyGame -v $VERSION -p build/StandaloneWindows64 -e NouveauDossier.exe -o VelopackReleases
          
      # 6. Upload all Velopack files to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VelopackReleases/*
          generate_release_notes: true